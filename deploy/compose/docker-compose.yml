name: chatim

x-core: &core
  image: chatim/core:dev
  profiles: ["app"]
  restart: unless-stopped
  mem_limit: 1g
  stop_grace_period: 30s
  depends_on:
    mongodb-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    nats:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app", "probe"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 60s
    start_interval: 1s

x-core-env: &core-env
  MONGO_URI: "mongodb://${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@chatim-mongodb:27017/?replicaSet=rs0&authSource=admin"
  REDIS_ADDR: chatim-redis:6379
  NATS_URL: nats://chatim-nats:4222
  GOMEMLIMIT: 920MiB

services:
  mongodb:
    image: mongo:8.2
    container_name: chatim-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    entrypoint:
      - bash
      - -c
      - >-
        if [ ! -f /data/db/mongo-keyfile ]; then openssl rand -base64 756 > /data/db/mongo-keyfile;
        chmod 400 /data/db/mongo-keyfile; chown 999:999 /data/db/mongo-keyfile; fi;
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/db/mongo-keyfile
        --wiredTigerCacheSizeGB ${MONGO_CACHE_GB:-3} --oplogSize 4096
    ports:
      - "${MONGO_PORT:-27117}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.runCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongodb-init:
    image: mongo:8.2
    container_name: chatim-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_USER: ${MONGO_ROOT_USER}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
    entrypoint: ["bash", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do
        mongosh --host chatim-mongodb -u "$$MONGO_USER" -p "$$MONGO_PASSWORD" --authenticationDatabase admin --quiet
        --eval 'try { rs.status(); print("replica set already initialized") }
        catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "chatim-mongodb:27017" }] }); print("replica set initialized") }'
        && exit 0; sleep 2; done; exit 1
    restart: "no"

  redis:
    image: redis:7.4.2-alpine
    container_name: chatim-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15-alpine
    container_name: chatim-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4223}:4222"
      - "${NATS_MON_PORT:-8223}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18
    container_name: chatim-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    shm_size: 1g
    environment:
      POSTGRES_USER: ${PG_USER:?set PG_USER in .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: chatim_poc
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-3GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=200
      - -c
      - wal_buffers=64MB
      - -c
      - wal_compression=lz4
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - default_toast_compression=lz4
      - -c
      - jit=off
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d chatim_poc"]
      interval: 5s
      timeout: 3s
      retries: 20

  core-1:
    <<: *core
    container_name: chatim-core-1
    environment:
      <<: *core-env
      CORE_ID: core-1
    ports:
      - "127.0.0.1:${CORE1_GRPC_PORT:-9001}:9000"

  core-2:
    <<: *core
    container_name: chatim-core-2
    environment:
      <<: *core-env
      CORE_ID: core-2
    ports:
      - "127.0.0.1:${CORE2_GRPC_PORT:-9002}:9000"

networks:
  default:
    name: chatim_default

volumes:
  mongodb_data:
  redis_data:
  nats_data:
  postgres_data:
