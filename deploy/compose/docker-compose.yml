name: chatim

x-redis: &redis
  image: redis:7.4.2-alpine
  restart: unless-stopped
  entrypoint:
    - sh
    - -c
    - >-
      set -eu;
      conf=/etc/redis/auth.conf;
      read -r pw < "$$REDIS_SECRET_FILE" || true;
      if [ -z "$$pw" ]; then echo "empty secret $$REDIS_SECRET_FILE" >&2; exit 1; fi;
      umask 077; mkdir -p "$${conf%/*}";
      printf 'requirepass "%s"\n' "$$pw" > "$$conf"; unset pw;
      chown -R redis:redis "$${conf%/*}"; chmod 600 "$$conf";
      exec docker-entrypoint.sh redis-server "$$conf" "$$@"
    - redis-start
  healthcheck:
    test: ["CMD-SHELL", "read -r REDISCLI_AUTH < \"$$REDIS_SECRET_FILE\"; export REDISCLI_AUTH; redis-cli ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 10

x-chat: &chat
  image: chatim/chat:dev
  profiles: ["app"]
  restart: unless-stopped
  mem_limit: 1g
  stop_grace_period: 33s
  secrets: [mongo_password, redis_password, redis_dedupe_password, media_s3_secret_key]
  depends_on:
    mongodb-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    redis-dedupe:
      condition: service_healthy
    nats:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app", "probe"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 60s
    start_interval: 1s

x-chat-env: &chat-env
  MONGO_URI: "mongodb://chatim-mongodb:27017/?replicaSet=rs0&authSource=admin"
  MONGO_USER: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
  MONGO_PASSWORD_FILE: /run/secrets/mongo_password
  REDIS_ADDR: chatim-redis:6379
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  REDIS_DEDUPE_ADDR: chatim-redis-dedupe:6379
  REDIS_DEDUPE_PASSWORD_FILE: /run/secrets/redis_dedupe_password
  NATS_URL: nats://chatim-nats:4222
  MEDIA_ENABLED: ${MEDIA_ENABLED:-true}
  MEDIA_S3_ENDPOINT: http://chatim-s3:3900
  MEDIA_S3_PUBLIC_ENDPOINT: http://chatim-s3:3900
  MEDIA_S3_REGION: us-east-1
  MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?set MEDIA_S3_ACCESS_KEY in .env}
  MEDIA_S3_SECRET_KEY_FILE: /run/secrets/media_s3_secret_key
  MEDIA_S3_BUCKET_PROCESSING: chatim-media-processing
  MEDIA_S3_BUCKET_COMPLETED: chatim-media-completed
  GOMEMLIMIT: 920MiB
  GOGC: ${CHAT_GOGC:-100}

x-jwt-env: &jwt-env
  JWT_ISSUER: chatim-dev
  JWT_AUDIENCE: chatim-websocket

x-identity-env: &identity-env
  <<: *jwt-env
  MONGO_URI: mongodb://chatim-mongodb:27017/?replicaSet=rs0
  MONGO_USER: identity
  MONGO_PASSWORD_FILE: /run/secrets/identity_mongo_password
  IDENTITY_KEY_ENCRYPTION_KEY_FILE: /run/secrets/identity_key_encryption_key
  IDENTITY_NODE_SECRET_FILE: /run/secrets/identity_node_secret
  IDENTITY_KEY_ACTIVATE_LEAD: 65s
  IDENTITY_KEY_RELOAD: 5s
  IDENTITY_EXCHANGE_AUDIENCE: chatim
  IDENTITY_EXCHANGE_IP_RATE: ${IDENTITY_EXCHANGE_IP_RATE:-50}
  APP_CORS_ORIGINS: ${IDENTITY_CORS_ORIGINS:-http://localhost:3000}
  GOMEMLIMIT: 800MiB

x-identity: &identity
  image: chatim/identity:dev
  profiles: ["app"]
  restart: unless-stopped
  mem_limit: 1g
  stop_grace_period: 30s
  secrets: [identity_mongo_password, identity_key_encryption_key, identity_node_secret]
  environment:
    <<: *identity-env
  networks:
    default:
      aliases: [chatim-identity]
  depends_on:
    identity-bootstrap:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "/app", "probe"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 30s
    start_interval: 1s

x-websocket: &websocket
  image: chatim/websocket:dev
  profiles: ["app"]
  restart: unless-stopped
  mem_limit: 2g
  ulimits:
    nofile: 65536
  stop_grace_period: 18s
  secrets: [redis_password, redis_presence_password, ws_jwks, identity_node_secret]
  depends_on:
    identity-1:
      condition: service_healthy
    identity-2:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-presence:
      condition: service_healthy
    chat-1:
      condition: service_healthy
    chat-2:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app", "probe"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 30s
    start_interval: 1s

x-websocket-env: &websocket-env
  <<: *jwt-env
  REDIS_ADDR: chatim-redis:6379
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  SHARED_REDIS_ADDR: chatim-redis-presence:6379
  SHARED_REDIS_PASSWORD_FILE: /run/secrets/redis_presence_password
  JWT_KEYS_FILE: /run/secrets/ws_jwks
  IDENTITY_INTERNAL_URL: http://chatim-identity:8081
  IDENTITY_NODE_SECRET_FILE: /run/secrets/identity_node_secret
  IDENTITY_JWKS_URL: http://chatim-identity:8080/.well-known/jwks.json
  IDENTITY_KEYS_INTERVAL: 10s
  IDENTITY_ALLOW_HTTP: "true"
  NATS_URL: nats://chatim-nats:4222
  GOMEMLIMIT: 1600MiB

services:
  mongodb:
    image: mongo:8.2
    container_name: chatim-mongodb
    restart: unless-stopped
    secrets: [mongo_password]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    entrypoint:
      - bash
      - -c
      - >-
        if [ ! -f /data/db/mongo-keyfile ]; then openssl rand -base64 756 > /data/db/mongo-keyfile;
        chmod 400 /data/db/mongo-keyfile; chown 999:999 /data/db/mongo-keyfile; fi;
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/db/mongo-keyfile
        --wiredTigerCacheSizeGB ${MONGO_CACHE_GB:-3} --oplogSize 4096
    ports:
      - "${MONGO_PORT:-27117}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME,
          require("fs").readFileSync("/run/secrets/mongo_password", "utf8").trim());
          print(db.runCommand("ping").ok)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongodb-init:
    image: mongo:8.2
    container_name: chatim-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    secrets: [mongo_password]
    environment:
      MONGO_USER: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
    entrypoint: ["bash", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do
        mongosh --host chatim-mongodb --quiet
        --eval 'db.getSiblingDB("admin").auth(process.env.MONGO_USER, require("fs").readFileSync("/run/secrets/mongo_password", "utf8").trim());
        try { rs.status(); print("replica set already initialized") }
        catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "chatim-mongodb:27017" }] }); print("replica set initialized") }'
        && exit 0; sleep 2; done; exit 1
    restart: "no"

  redis:
    <<: *redis
    container_name: chatim-redis
    secrets: [redis_password]
    environment:
      REDIS_SECRET_FILE: /run/secrets/redis_password
    command: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data

  redis-dedupe:
    <<: *redis
    container_name: chatim-redis-dedupe
    secrets: [redis_dedupe_password]
    environment:
      REDIS_SECRET_FILE: /run/secrets/redis_dedupe_password
    command: ["--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_DEDUPE_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_DEDUPE_PORT:-6381}:6379"
    tmpfs:
      - /data

  redis-presence:
    <<: *redis
    container_name: chatim-redis-presence
    secrets: [redis_presence_password]
    environment:
      REDIS_SECRET_FILE: /run/secrets/redis_presence_password
    command: ["--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PRESENCE_PORT:-6382}:6379"
    tmpfs:
      - /data

  nats:
    image: nats:2.15-alpine
    container_name: chatim-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4223}:4222"
      - "${NATS_MON_PORT:-8223}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: chatim-s3
    restart: unless-stopped
    secrets: [s3_rpc_secret]
    environment:
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    ports:
      - "${S3_PORT:-9100}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - s3_data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-mongo-init:
    image: mongo:8.2
    container_name: chatim-identity-mongo-init
    profiles: ["app"]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    secrets: [mongo_password, identity_mongo_password]
    environment:
      MONGO_USER: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
    entrypoint: ["bash", "-c"]
    command:
      - >-
        mongosh --host chatim-mongodb --quiet
        --eval 'const fs = require("fs");
        db.getSiblingDB("admin").auth(process.env.MONGO_USER, fs.readFileSync("/run/secrets/mongo_password", "utf8").trim());
        const identityDB = db.getSiblingDB("chatim_identity");
        const identityPassword = fs.readFileSync("/run/secrets/identity_mongo_password", "utf8").trim();
        if (identityPassword === "") { throw new Error("empty secret identity_mongo_password") }
        if (identityDB.getUser("identity") === null) {
        identityDB.createUser({ user: "identity", pwd: identityPassword, roles: [{ role: "readWrite", db: "chatim_identity" }] })
        } else {
        identityDB.updateUser("identity", { pwd: identityPassword })
        }
        print("identity user ready")'
    restart: "no"

  identity-bootstrap:
    image: chatim/identity:dev
    container_name: chatim-identity-bootstrap
    profiles: ["app"]
    user: "${CHATIM_UID:-65532}:${CHATIM_GID:-65532}"
    command: ["bootstrap", "-jwks", "/keys/jwks.json"]
    secrets: [identity_mongo_password, identity_key_encryption_key, identity_node_secret]
    environment:
      <<: *identity-env
    volumes:
      - ../../.local/ws-keys:/keys
    depends_on:
      identity-mongo-init:
        condition: service_completed_successfully
    restart: "no"

  identity-1:
    <<: *identity
    container_name: chatim-identity-1
    ports:
      - "127.0.0.1:8084:8080"

  identity-2:
    <<: *identity
    container_name: chatim-identity-2

  chat-1:
    <<: *chat
    container_name: chatim-chat-1
    environment:
      <<: *chat-env
      APP_NODE_ID: chat-1

  chat-2:
    <<: *chat
    container_name: chatim-chat-2
    environment:
      <<: *chat-env
      APP_NODE_ID: chat-2

  websocket-1:
    <<: *websocket
    container_name: chatim-websocket-1
    environment:
      <<: *websocket-env
      APP_NODE_ID: websocket-1
    ports:
      - "127.0.0.1:8081:8080"

  websocket-2:
    <<: *websocket
    container_name: chatim-websocket-2
    environment:
      <<: *websocket-env
      APP_NODE_ID: websocket-2

  gateway-1:
    image: chatim/gateway:dev
    container_name: chatim-gateway-1
    profiles: ["app"]
    restart: unless-stopped
    mem_limit: 1g
    stop_grace_period: 18s
    secrets: [ws_jwks, identity_node_secret, redis_password, redis_presence_password]
    environment:
      <<: *jwt-env
      REDIS_ADDR: chatim-redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_KEYS_FILE: /run/secrets/ws_jwks
      IDENTITY_INTERNAL_URL: http://chatim-identity:8081
      IDENTITY_NODE_SECRET_FILE: /run/secrets/identity_node_secret
      IDENTITY_JWKS_URL: http://chatim-identity:8080/.well-known/jwks.json
      IDENTITY_KEYS_INTERVAL: 10s
      IDENTITY_ALLOW_HTTP: "true"
      SHARED_REDIS_ADDR: chatim-redis-presence:6379
      SHARED_REDIS_PASSWORD_FILE: /run/secrets/redis_presence_password
      APP_CORS_ORIGINS: ${GW_CORS_ORIGINS:-http://localhost:3000}
      GOMEMLIMIT: 800MiB
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      identity-1:
        condition: service_healthy
      identity-2:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-presence:
        condition: service_healthy
      chat-1:
        condition: service_healthy
      chat-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "probe"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

secrets:
  ws_jwks:
    file: ../../.local/ws-keys/jwks.json
  mongo_password:
    environment: MONGO_ROOT_PASSWORD
  redis_password:
    environment: REDIS_PASSWORD
  redis_dedupe_password:
    environment: REDIS_DEDUPE_PASSWORD
  redis_presence_password:
    environment: REDIS_PRESENCE_PASSWORD
  identity_mongo_password:
    environment: IDENTITY_MONGO_PASSWORD
  identity_key_encryption_key:
    environment: IDENTITY_KEY_ENCRYPTION_KEY
  identity_node_secret:
    environment: IDENTITY_NODE_SECRET
  s3_rpc_secret:
    environment: S3_RPC_SECRET
  media_s3_secret_key:
    environment: MEDIA_S3_SECRET_KEY

networks:
  default:
    name: chatim_default

volumes:
  mongodb_data:
  s3_data:
  redis_data:
  nats_data:
