name: chatim

x-redis: &redis
  image: redis:7.4.2-alpine
  restart: unless-stopped
  entrypoint:
    - sh
    - -c
    - >-
      set -eu;
      conf=/etc/redis/auth.conf;
      read -r pw < "$$REDIS_SECRET_FILE" || true;
      if [ -z "$$pw" ]; then echo "empty secret $$REDIS_SECRET_FILE" >&2; exit 1; fi;
      umask 077; mkdir -p "$${conf%/*}";
      printf 'requirepass "%s"\n' "$$pw" > "$$conf"; unset pw;
      chown -R redis:redis "$${conf%/*}"; chmod 600 "$$conf";
      exec docker-entrypoint.sh redis-server "$$conf" "$$@"
    - redis-start
  healthcheck:
    test: ["CMD-SHELL", "read -r REDISCLI_AUTH < \"$$REDIS_SECRET_FILE\"; export REDISCLI_AUTH; redis-cli ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 10

x-core: &core
  image: chatim/core:dev
  profiles: ["app"]
  restart: unless-stopped
  mem_limit: 1g
  stop_grace_period: 33s
  secrets: [mongo_password, redis_password, redis_dedupe_password]
  depends_on:
    mongodb-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    redis-dedupe:
      condition: service_healthy
    nats:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app", "probe"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 60s
    start_interval: 1s

x-core-env: &core-env
  MONGO_URI: "mongodb://chatim-mongodb:27017/?replicaSet=rs0&authSource=admin"
  MONGO_USER: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
  MONGO_PASSWORD_FILE: /run/secrets/mongo_password
  REDIS_ADDR: chatim-redis:6379
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  REDIS_DEDUPE_ADDR: chatim-redis-dedupe:6379
  REDIS_DEDUPE_PASSWORD_FILE: /run/secrets/redis_dedupe_password
  NATS_URL: nats://chatim-nats:4222
  GOMEMLIMIT: 920MiB
  GOGC: ${CORE_GOGC:-100}

x-iam-env: &iam-env
  IAM_PG_URI: postgres://iam@chatim-postgres:5432/chatim_iam
  IAM_PG_PASSWORD_FILE: /run/secrets/iam_pg_password
  IAM_KEY_ENCRYPTION_KEY_FILE: /run/secrets/iam_key_encryption_key
  IAM_NODE_SECRET_FILE: /run/secrets/iam_node_secret
  IAM_KEY_ACTIVATE_LEAD: 10s
  IAM_PUBLIC_URL: http://chatim-iam-1:8080
  IAM_ISSUER: chatim-dev
  IAM_AUDIENCE: chatim-websocket
  IAM_CORS_ORIGINS: ${IAM_CORS_ORIGINS:-http://localhost:3000}
  GOMEMLIMIT: 800MiB

x-websocket: &websocket
  image: chatim/websocket:dev
  profiles: ["app"]
  restart: unless-stopped
  mem_limit: 2g
  ulimits:
    nofile: 65536
  stop_grace_period: 18s
  secrets: [redis_password, redis_presence_password, ws_jwks, iam_node_secret]
  depends_on:
    iam-1:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-presence:
      condition: service_healthy
    core-1:
      condition: service_healthy
    core-2:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app", "probe"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 30s
    start_interval: 1s

x-websocket-env: &websocket-env
  REDIS_ADDR: chatim-redis:6379
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  WS_PRESENCE_REDIS_ADDR: chatim-redis-presence:6379
  WS_PRESENCE_REDIS_PASSWORD_FILE: /run/secrets/redis_presence_password
  WS_JWT_KEYS_FILE: /run/secrets/ws_jwks
  WS_JWT_ISSUER: chatim-dev
  WS_JWT_AUDIENCE: chatim-websocket
  WS_IAM_INTERNAL_URL: http://chatim-iam-1:8081
  WS_IAM_SECRET_FILE: /run/secrets/iam_node_secret
  WS_IAM_JWKS_URL: http://chatim-iam-1:8080/.well-known/jwks.json
  WS_IAM_KEYS_INTERVAL: 10s
  WS_IAM_ALLOW_HTTP: "true"
  NATS_URL: nats://chatim-nats:4222
  GOMEMLIMIT: 1600MiB

services:
  mongodb:
    image: mongo:8.2
    container_name: chatim-mongodb
    restart: unless-stopped
    secrets: [mongo_password]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    entrypoint:
      - bash
      - -c
      - >-
        if [ ! -f /data/db/mongo-keyfile ]; then openssl rand -base64 756 > /data/db/mongo-keyfile;
        chmod 400 /data/db/mongo-keyfile; chown 999:999 /data/db/mongo-keyfile; fi;
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/db/mongo-keyfile
        --wiredTigerCacheSizeGB ${MONGO_CACHE_GB:-3} --oplogSize 4096
    ports:
      - "${MONGO_PORT:-27117}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME,
          require("fs").readFileSync("/run/secrets/mongo_password", "utf8").trim());
          print(db.runCommand("ping").ok)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongodb-init:
    image: mongo:8.2
    container_name: chatim-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    secrets: [mongo_password]
    environment:
      MONGO_USER: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
    entrypoint: ["bash", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do
        mongosh --host chatim-mongodb --quiet
        --eval 'db.getSiblingDB("admin").auth(process.env.MONGO_USER, require("fs").readFileSync("/run/secrets/mongo_password", "utf8").trim());
        try { rs.status(); print("replica set already initialized") }
        catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "chatim-mongodb:27017" }] }); print("replica set initialized") }'
        && exit 0; sleep 2; done; exit 1
    restart: "no"

  redis:
    <<: *redis
    container_name: chatim-redis
    secrets: [redis_password]
    environment:
      REDIS_SECRET_FILE: /run/secrets/redis_password
    command: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data

  redis-dedupe:
    <<: *redis
    container_name: chatim-redis-dedupe
    secrets: [redis_dedupe_password]
    environment:
      REDIS_SECRET_FILE: /run/secrets/redis_dedupe_password
    command: ["--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_DEDUPE_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_DEDUPE_PORT:-6381}:6379"
    tmpfs:
      - /data

  redis-presence:
    <<: *redis
    container_name: chatim-redis-presence
    secrets: [redis_presence_password]
    environment:
      REDIS_SECRET_FILE: /run/secrets/redis_presence_password
    command: ["--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PRESENCE_PORT:-6382}:6379"
    tmpfs:
      - /data

  nats:
    image: nats:2.15-alpine
    container_name: chatim-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4223}:4222"
      - "${NATS_MON_PORT:-8223}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18
    container_name: chatim-postgres
    profiles: ["postgres", "app"]
    restart: unless-stopped
    shm_size: 1g
    secrets: [pg_password]
    environment:
      POSTGRES_USER: ${PG_USER:?set PG_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: chatim_poc
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=200
      - -c
      - wal_buffers=64MB
      - -c
      - wal_compression=lz4
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - default_toast_compression=lz4
      - -c
      - jit=off
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d chatim_poc"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-init:
    image: postgres:18
    container_name: chatim-postgres-init
    profiles: ["postgres", "app"]
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [pg_password, iam_pg_password]
    environment:
      PGHOST: chatim-postgres
      PGUSER: ${PG_USER:?set PG_USER in .env}
      PGDATABASE: postgres
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        PGPASSWORD="$$(cat /run/secrets/pg_password)"
        export PGPASSWORD
        psql -v ON_ERROR_STOP=1 -q <<'SQL'
        \set iam_password `cat /run/secrets/iam_pg_password`
        SELECT 'CREATE ROLE iam LOGIN' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'iam') \gexec
        SELECT format('ALTER ROLE iam LOGIN PASSWORD %L', :'iam_password') \gexec
        SELECT 'CREATE DATABASE chatim_iam OWNER iam' WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'chatim_iam') \gexec
        SQL
        echo "iam role and database ready"
    restart: "no"

  iam-bootstrap:
    image: chatim/iam:dev
    container_name: chatim-iam-bootstrap
    profiles: ["app"]
    user: "${CHATIM_UID:-65532}:${CHATIM_GID:-65532}"
    command: ["bootstrap", "-jwks", "/keys/jwks.json"]
    secrets: [iam_pg_password, iam_key_encryption_key, iam_node_secret]
    environment:
      <<: *iam-env
    volumes:
      - ../../.local/ws-keys:/keys
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    restart: "no"

  iam-1:
    image: chatim/iam:dev
    container_name: chatim-iam-1
    profiles: ["app"]
    restart: unless-stopped
    mem_limit: 1g
    stop_grace_period: 30s
    secrets: [iam_pg_password, iam_key_encryption_key, iam_node_secret]
    environment:
      <<: *iam-env
    ports:
      - "127.0.0.1:${IAM1_PORT:-8084}:8080"
    depends_on:
      iam-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "probe"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  core-1:
    <<: *core
    container_name: chatim-core-1
    environment:
      <<: *core-env
      CORE_ID: core-1
    ports:
      - "127.0.0.1:${CORE1_GRPC_PORT:-9001}:9000"

  core-2:
    <<: *core
    container_name: chatim-core-2
    environment:
      <<: *core-env
      CORE_ID: core-2
    ports:
      - "127.0.0.1:${CORE2_GRPC_PORT:-9002}:9000"

  websocket-1:
    <<: *websocket
    container_name: chatim-websocket-1
    environment:
      <<: *websocket-env
      WS_NODE_ID: websocket-1
    ports:
      - "127.0.0.1:${WS1_PORT:-8081}:8080"

  websocket-2:
    <<: *websocket
    container_name: chatim-websocket-2
    environment:
      <<: *websocket-env
      WS_NODE_ID: websocket-2
    ports:
      - "127.0.0.1:${WS2_PORT:-8083}:8080"

  gateway-1:
    image: chatim/gateway:dev
    container_name: chatim-gateway-1
    profiles: ["app"]
    restart: unless-stopped
    mem_limit: 1g
    stop_grace_period: 18s
    secrets: [ws_jwks, iam_node_secret, redis_presence_password]
    environment:
      GW_CORE_ADDRS: chatim-core-1:9000,chatim-core-2:9000
      GW_JWT_KEYS_FILE: /run/secrets/ws_jwks
      GW_JWT_ISSUER: chatim-dev
      GW_JWT_AUDIENCE: chatim-websocket
      GW_IAM_INTERNAL_URL: http://chatim-iam-1:8081
      GW_IAM_SECRET_FILE: /run/secrets/iam_node_secret
      GW_IAM_JWKS_URL: http://chatim-iam-1:8080/.well-known/jwks.json
      GW_IAM_KEYS_INTERVAL: 10s
      GW_IAM_ALLOW_HTTP: "true"
      GW_SHARED_REDIS_ADDR: chatim-redis-presence:6379
      GW_SHARED_REDIS_PASSWORD_FILE: /run/secrets/redis_presence_password
      GW_CORS_ORIGINS: ${GW_CORS_ORIGINS:-http://localhost:3000}
      GOMEMLIMIT: 800MiB
    ports:
      - "127.0.0.1:${GW1_PORT:-8082}:8080"
    depends_on:
      iam-1:
        condition: service_healthy
      redis-presence:
        condition: service_healthy
      core-1:
        condition: service_healthy
      core-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "probe"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

secrets:
  ws_jwks:
    file: ../../.local/ws-keys/jwks.json
  mongo_password:
    environment: MONGO_ROOT_PASSWORD
  redis_password:
    environment: REDIS_PASSWORD
  redis_dedupe_password:
    environment: REDIS_DEDUPE_PASSWORD
  redis_presence_password:
    environment: REDIS_PRESENCE_PASSWORD
  pg_password:
    environment: PG_PASSWORD
  iam_pg_password:
    environment: IAM_PG_PASSWORD
  iam_key_encryption_key:
    environment: IAM_KEY_ENCRYPTION_KEY
  iam_node_secret:
    environment: IAM_NODE_SECRET

networks:
  default:
    name: chatim_default

volumes:
  mongodb_data:
  redis_data:
  nats_data:
  postgres_data:
