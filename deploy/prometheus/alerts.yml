groups:
  - name: chatim-core-guarantees
    rules:
      - alert: ChatimReconcilerAbsent
        expr: sum(chatim_core_reconcile_running) == 0
        for: 2m
        labels:
          severity: critical
          guarantee: RC1
        annotations:
          summary: No core runs the change reader; committed changes do not reach the work stream.
      - alert: ChatimReconcilerLagging
        expr: max(chatim_core_reconcile_lag_seconds) > 120
        for: 5m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: Effect workers run more than two minutes behind their effect delay.
      - alert: ChatimReconcilerDropping
        expr: sum(increase(chatim_core_reconcile_dropped_total[15m])) > 0
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: The change reader found corrupt changes it could not turn into work records.
      - alert: ChatimFeedHistoryLost
        expr: sum(increase(chatim_core_reconcile_history_lost_total[15m])) > 0
        labels:
          severity: critical
          guarantee: RC5
        annotations:
          summary: The change feed position fell out of the oplog; events in the gap are lost until a manual resync.
      - alert: ChatimOplogWindowShort
        expr: min(chatim_core_mongo_oplog_window_seconds) < 172800
        for: 15m
        labels:
          severity: warning
          guarantee: RC5
        annotations:
          summary: The oplog covers less than 48h.
      - alert: ChatimOplogWindowCritical
        expr: min(chatim_core_mongo_oplog_window_seconds) < 86400
        for: 15m
        labels:
          severity: critical
          guarantee: RC5
        annotations:
          summary: The oplog covers less than 24h, below the minimum retention.
      - alert: ChatimOplogWindowUnknown
        expr: count(chatim_core_mongo_oplog_window_seconds != chatim_core_mongo_oplog_window_seconds) > 0
        for: 10m
        labels:
          severity: warning
          guarantee: RC5
        annotations:
          summary: A core cannot read the oplog window; the RC5 detector is blind.
      - alert: ChatimRepublishSurge
        expr: sum(rate(chatim_core_reconcile_republished_total[5m])) > 100
        for: 10m
        labels:
          severity: warning
          guarantee: RC4
        annotations:
          summary: Effect workers send more than 100 events per second that had no ack mark.
      - alert: ChatimEventsDropped
        expr: sum(rate(chatim_core_publish_dropped_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: The fast path keeps dropping events; delivery waits for the effect workers.
      - alert: ChatimRedisDegraded
        expr: max by (client) (chatim_core_redis_degraded) == 1
        for: 1m
        labels:
          severity: warning
          guarantee: CD2
        annotations:
          summary: A dedupe redis client is degraded; cross-core duplicates are possible.
      - alert: ChatimCIDSettleDropped
        expr: sum(increase(chatim_core_cid_settle_dropped_total[5m])) > 0
        labels:
          severity: warning
          guarantee: CD1
        annotations:
          summary: Cid commits were dropped; retries may wait for the pending window.
      - alert: ChatimCIDPendingElsewhere
        expr: sum(increase(chatim_core_cid_pending_elsewhere_total[5m])) > 0
        labels:
          severity: info
          guarantee: CD3
        annotations:
          summary: Sends hit a cid pending on another core, the CD3 duplicate window.
      - alert: ChatimSeqContention
        expr: sum(increase(chatim_core_room_yields_total[5m])) > 10
        labels:
          severity: warning
          guarantee: P1
        annotations:
          summary: Actors keep yielding rooms after seq contention; check slot ownership.
      - alert: ChatimWorkFailing
        expr: sum(rate(chatim_core_work_failures_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: Effect workers keep failing work records; events and room activity wait for retries.
      - alert: ChatimEffectDropping
        expr: sum by (effect) (increase(chatim_core_effect_dropped_total[15m])) > 0
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: An effect gave up on work records whose document could not be read.
      - alert: ChatimCounterRepairSurge
        expr: sum by (counter) (rate(chatim_core_counter_repaired_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          guarantee: CT1
        annotations:
          summary: Effect workers keep rewriting counter summaries the fast path left stale; check fast path touch failures and hot targets.
