groups:
  - name: chatim-core-guarantees
    rules:
      - alert: ChatimOplogWindowShort
        expr: min(chatim_core_mongo_oplog_window_seconds) < 172800
        for: 15m
        labels:
          severity: warning
          guarantee: RC5
        annotations:
          summary: The oplog covers less than 48h; a lagging or resyncing secondary has little room to catch up.
      - alert: ChatimOplogWindowCritical
        expr: min(chatim_core_mongo_oplog_window_seconds) < 86400
        for: 15m
        labels:
          severity: critical
          guarantee: RC5
        annotations:
          summary: The oplog covers less than 24h, below the minimum retention for replica health.
      - alert: ChatimOplogWindowUnknown
        expr: count(chatim_core_mongo_oplog_window_seconds != chatim_core_mongo_oplog_window_seconds) > 0
        for: 10m
        labels:
          severity: warning
          guarantee: RC5
        annotations:
          summary: A core cannot read the oplog window; the replica health check is blind.
      - alert: ChatimEventsDropped
        expr: sum(rate(chatim_core_publish_dropped_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: The fast path keeps dropping events; delivery waits for the sweeper.
      - alert: ChatimRedisDegraded
        expr: max by (client) (chatim_core_redis_degraded) == 1
        for: 1m
        labels:
          severity: warning
          guarantee: CD2
        annotations:
          summary: A dedupe redis client is degraded; cross-core duplicates are possible.
      - alert: ChatimCIDSettleDropped
        expr: sum(increase(chatim_core_cid_settle_dropped_total[5m])) > 0
        labels:
          severity: warning
          guarantee: CD1
        annotations:
          summary: Cid commits were dropped; retries may wait for the pending window.
      - alert: ChatimCIDPendingElsewhere
        expr: sum(increase(chatim_core_cid_pending_elsewhere_total[5m])) > 0
        labels:
          severity: info
          guarantee: CD3
        annotations:
          summary: Sends hit a cid pending on another core, the CD3 duplicate window.
      - alert: ChatimSeqContention
        expr: sum(increase(chatim_core_room_yields_total[5m])) > 10
        labels:
          severity: warning
          guarantee: P1
        annotations:
          summary: Actors keep yielding rooms after seq contention; check slot ownership.
      - alert: ChatimCounterRepairSurge
        expr: sum by (counter) (rate(chatim_core_counter_repaired_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          guarantee: CT1
        annotations:
          summary: Survival timer repairs keep rewriting counter summaries the fast path left stale; check fast path count failures and hot targets.
      - alert: ChatimEventPendingStuck
        expr: max(chatim_core_event_pending_oldest_seconds) > 60
        for: 5m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: A pending event flag has waited more than 60s; the sweeper cannot republish it (check NATS and the sweeper logs).
      - alert: ChatimProjectionLagging
        expr: max by (projection) (chatim_core_projection_lag_seconds) > 10
        for: 5m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: A projection runs more than 10s behind its events; room activity and reply indexes are stale.
      - alert: ChatimProjectionFailing
        expr: sum by (projection) (increase(chatim_core_projection_stuck_total[15m])) > 0
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: A projection keeps failing an event that has been delivered six times or more.
      - alert: ChatimMentionLagging
        expr: max(chatim_mention_lag_seconds) > 10
        for: 5m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: The mention consumer runs more than 10s behind its events; mention lists and notifications are late.
      - alert: ChatimMentionFailing
        expr: sum(increase(chatim_mention_stuck_total[15m])) > 0
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: The mention consumer keeps failing an event that has been delivered six times or more.
      - alert: ChatimSweeperIdle
        expr: sum(increase(chatim_core_sweep_passes_total[10m])) == 0
        for: 10m
        labels:
          severity: critical
          guarantee: RC1
        annotations:
          summary: No core finished a sweeper pass for 10 minutes; events lost before their ack are not republished.
      - alert: ChatimTimerFailing
        expr: sum(increase(chatim_core_timer_failures_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          guarantee: CT1
        annotations:
          summary: Fired count check timers keep failing their repair; member and message counts may stay stale.
  - name: chatim-websocket-gateway-health
    rules:
      - alert: ChatimWebsocketNATSDown
        expr: chatim_websocket_nats_connected == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A websocket node lost its NATS connection; its devices get no events or notifications until it reconnects.
      - alert: ChatimWebsocketBehind
        expr: chatim_websocket_consumer_behind_seconds > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A websocket stream consumer has stayed behind the stream end for more than 30s; devices on the node see events late.
      - alert: ChatimWebsocketJumpSuppressed
        expr: increase(chatim_websocket_catchup_jump_suppressed_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A websocket node fell too far behind again within the jump cooldown; it keeps replaying an old backlog instead of skipping to the stream end.
      - alert: ChatimWebsocketReloadFailing
        expr: sum by (instance) (increase(chatim_websocket_reload_failures_total[5m])) + sum by (instance) (increase(chatim_websocket_room_ids_load_failures_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Room loads of a websocket node keep failing; its users get load_failed and no events until a load succeeds (check core ListMyRoomIDs).
      - alert: ChatimWebsocketDeliverySlow
        expr: histogram_quantile(0.99, sum by (le, instance) (rate(chatim_websocket_event_delivery_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The p99 time from the JetStream store time of an event to its frame queued on a websocket node is above 100ms.
      - alert: ChatimPresenceRedisDown
        expr: chatim_websocket_presence_redis_up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A websocket node cannot reach the presence Redis; its users show offline everywhere and its devices get no presence answers.
      - alert: ChatimWebsocketAuthRateLimited
        expr: sum by (instance) (rate(chatim_websocket_auth_total{result="rate"}[10m])) / sum by (instance) (rate(chatim_websocket_auth_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 10% of the logins on a websocket node get retry_later from the node login limiter; a reconnect storm is waiting, or WS_AUTH_RATE and WS_AUTH_BURST are too low for the node.
      - alert: ChatimWebsocketTokenExpiredSurge
        expr: sum by (instance) (increase(chatim_websocket_auth_required_total{reason="expired"}[10m])) > 1000
        labels:
          severity: warning
        annotations:
          summary: More than 1000 running connections of a websocket node went back to waiting on an expired token in 10m; clients are not renewing tokens in time. The threshold depends on the user count of the node.
      - alert: ChatimGatewayCoreUnavailable
        expr: sum(rate(chatim_gateway_commands_total{code="Unavailable"}[5m])) / sum(rate(chatim_gateway_commands_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of gateway commands end Unavailable; core is down, overloaded or unreachable from the gateway.
  - name: chatim-iam-health
    rules:
      - alert: ChatimIamHashSaturated
        expr: sum(increase(chatim_iam_login_total{result="busy"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: iam refused logins because every password hash slot was busy for 5m; a login flood is running or IAM_HASH_CONCURRENCY is too low for the load.
      - alert: ChatimIamRefreshReuse
        expr: sum(increase(chatim_iam_refresh_total{result="reuse"}[10m])) > 10
        labels:
          severity: warning
        annotations:
          summary: More than 10 sessions were revoked in 10m because an old refresh token came back after the grace window; refresh tokens may be leaking, or a client resends tokens late.
      - alert: ChatimIamNoSigningKey
        expr: min(chatim_iam_signing_key_ready) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An iam node has no active signing key, so it cannot issue tokens; run key-rotate -activate-if-none, or check IAM_KEY_ENCRYPTION_KEY.
      - alert: ChatimIamStoreErrors
        expr: sum(rate(chatim_iam_store_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: iam has been getting Postgres errors for 5m; logins and refreshes fail with Unavailable.
  - name: chatim-iam-sync
    rules:
      - alert: ChatimIamSyncStale
        expr: |
          max by (instance) (chatim_websocket_iam_revocations_age_seconds) > 30
          or
          max by (instance) (chatim_gateway_iam_revocations_age_seconds) > 30
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A websocket or gateway node has not refreshed the iam revocation list from iam or the shared redis copy for over 30s; tokens revoked since then still work on that node until they expire.
      - alert: ChatimIamKeysStale
        expr: |
          max by (instance) (chatim_websocket_iam_keys_age_seconds) > 180
          or
          max by (instance) (chatim_gateway_iam_keys_age_seconds) > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A websocket or gateway node has not fetched the iam JWKS for over 3 minutes; tokens signed by a newly activated key are refused there.
      - alert: ChatimIamRefused
        expr: max by (instance) (chatim_websocket_iam_refused) > 0 or max by (instance) (chatim_gateway_iam_refused) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: iam answers a websocket or gateway node with 4xx (wrong node secret or iam url); the node stays not ready. Check *_IAM_SECRET, *_IAM_INTERNAL_URL and *_IAM_JWKS_URL against iam.
      - alert: ChatimJwksConflict
        expr: sum by (instance) (increase(chatim_websocket_jwks_conflicts_total[10m])) > 0 or sum by (instance) (increase(chatim_gateway_jwks_conflicts_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: iam published a key whose kid the node key file holds with a different key; the iam key is ignored there. Check the JWKS file and the iam signing keys.
  - name: chatim-iam-directory
    rules:
      - alert: ChatimIamDirectoryNotReady
        expr: min by (instance) (chatim_iam_directory_ready) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An iam replica has not loaded the directory into memory for over 1m, so it stays not ready and serves nothing; Postgres is down or unreachable, or every load slot is held. Check chatim_iam_directory_load_failures_total and the iam log.
      - alert: ChatimIamDirectoryStale
        expr: max by (instance) (chatim_iam_directory_lag_seconds) > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An iam replica has not caught up with the directory change feed for over 30s; GetUsers there returns old names and groups, and sessions revoked since then can still read the directory. Postgres is unreachable from that replica.
      - alert: ChatimIamDirectoryFeedStuck
        expr: max(chatim_iam_directory_horizon_stalled_seconds) > 60
        labels:
          severity: warning
        annotations:
          summary: The iam directory feed has waited over 60s on a transaction that is still open below the Postgres xmin horizon; no directory change reaches the replicas or the feed until it ends. Find the long transaction in pg_stat_activity on the iam Postgres server.
      - alert: ChatimIamDirectoryListenDown
        expr: min by (instance) (chatim_iam_directory_listen_up) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An iam replica has had no Postgres LISTEN connection for 5m; it still rechecks the directory every 2s, so changes arrive up to 2s late. Check that no transaction-mode PgBouncer sits in front of iam and that IAM_PG_MAX_CONNS leaves room.
      - alert: ChatimIamMemoryHigh
        expr: |
          (
            go_memstats_heap_inuse_bytes > 0.8 * go_gc_gomemlimit_bytes
            and
            go_gc_gomemlimit_bytes < 9e18
          )
          and on (instance, job) chatim_iam_memory_limit_set
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An iam replica has used over 80% of GOMEMLIMIT for 5m; the directory has grown past what the pod was sized for. Raise the pod memory and GOMEMLIMIT together.
      - alert: ChatimIamMemoryLimitUnset
        expr: min by (instance) (chatim_iam_memory_limit_set) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An iam replica runs without GOMEMLIMIT, so the directory in memory can push it into an OOM kill without the GC trying to hold back first. Set GOMEMLIMIT to about 90% of the pod memory limit.
