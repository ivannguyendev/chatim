groups:
  - name: chatim-chat-guarantees
    rules:
      - alert: ChatimOplogWindowShort
        expr: min(chatim_chat_mongo_oplog_window_seconds) < 172800
        for: 15m
        labels:
          severity: warning
          guarantee: RC5
        annotations:
          summary: The oplog covers less than 48h; a lagging or resyncing secondary has little room to catch up.
      - alert: ChatimOplogWindowCritical
        expr: min(chatim_chat_mongo_oplog_window_seconds) < 86400
        for: 15m
        labels:
          severity: critical
          guarantee: RC5
        annotations:
          summary: The oplog covers less than 24h, below the minimum retention for replica health.
      - alert: ChatimOplogWindowUnknown
        expr: count(chatim_chat_mongo_oplog_window_seconds != chatim_chat_mongo_oplog_window_seconds) > 0
        for: 10m
        labels:
          severity: warning
          guarantee: RC5
        annotations:
          summary: A chat cannot read the oplog window; the replica health check is blind.
      - alert: ChatimEventsDropped
        expr: sum(rate(chatim_chat_publish_dropped_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: The fast path keeps dropping events; delivery waits for the sweeper.
      - alert: ChatimRedisDegraded
        expr: max by (client) (chatim_chat_redis_degraded) == 1
        for: 1m
        labels:
          severity: warning
          guarantee: CD2
        annotations:
          summary: A dedupe redis client is degraded; cross-chat duplicates are possible.
      - alert: ChatimCIDSettleDropped
        expr: sum(increase(chatim_chat_cid_settle_dropped_total[5m])) > 0
        labels:
          severity: warning
          guarantee: CD1
        annotations:
          summary: Cid commits were dropped; retries may wait for the pending window.
      - alert: ChatimCIDPendingElsewhere
        expr: sum(increase(chatim_chat_cid_pending_elsewhere_total[5m])) > 0
        labels:
          severity: info
          guarantee: CD3
        annotations:
          summary: Sends hit a cid pending on another chat node, the CD3 duplicate window.
      - alert: ChatimSeqContention
        expr: sum(increase(chatim_chat_room_yields_total[5m])) > 10
        labels:
          severity: warning
          guarantee: P1
        annotations:
          summary: Actors keep yielding rooms after seq contention; check slot ownership.
      - alert: ChatimCounterRepairSurge
        expr: sum by (counter) (rate(chatim_chat_counter_repaired_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          guarantee: CT1
        annotations:
          summary: Survival timer repairs keep rewriting counter summaries the fast path left stale; check fast path count failures and hot targets.
      - alert: ChatimEventPendingStuck
        expr: max(chatim_chat_event_pending_oldest_seconds) > 60
        for: 5m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: A pending event flag has waited more than 60s; the sweeper cannot republish it (check NATS and the sweeper logs).
      - alert: ChatimProjectionLagging
        expr: max by (projection) (chatim_chat_projection_lag_seconds) > 10
        for: 5m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: A projection runs more than 10s behind its events; room activity and reply indexes are stale.
      - alert: ChatimProjectionFailing
        expr: sum by (projection) (increase(chatim_chat_projection_stuck_total[15m])) > 0
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: A projection keeps failing an event that has been delivered six times or more.
      - alert: ChatimMentionLagging
        expr: max(chatim_mention_lag_seconds) > 10
        for: 5m
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: The mention consumer runs more than 10s behind its events; mention lists and notifications are late.
      - alert: ChatimMentionFailing
        expr: sum(increase(chatim_mention_stuck_total[15m])) > 0
        labels:
          severity: warning
          guarantee: RC1
        annotations:
          summary: The mention consumer keeps failing an event that has been delivered six times or more.
      - alert: ChatimSweeperIdle
        expr: sum(increase(chatim_chat_sweep_passes_total[10m])) == 0
        for: 10m
        labels:
          severity: critical
          guarantee: RC1
        annotations:
          summary: No chat finished a sweeper pass for 10 minutes; events lost before their ack are not republished.
      - alert: ChatimTimerFailing
        expr: sum(increase(chatim_chat_timer_failures_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          guarantee: CT1
        annotations:
          summary: Fired count check timers keep failing their repair; member and message counts may stay stale.
  - name: chatim-websocket-gateway-health
    rules:
      - alert: ChatimWebsocketNATSDown
        expr: chatim_websocket_nats_connected == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A websocket node lost its NATS connection; its devices get no events or notifications until it reconnects.
      - alert: ChatimWebsocketBehind
        expr: chatim_websocket_consumer_behind_seconds > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A websocket stream consumer has stayed behind the stream end for more than 30s; devices on the node see events late.
      - alert: ChatimWebsocketJumpSuppressed
        expr: increase(chatim_websocket_catchup_jump_suppressed_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A websocket node fell too far behind again within the jump cooldown; it keeps replaying an old backlog instead of skipping to the stream end.
      - alert: ChatimWebsocketReloadFailing
        expr: sum by (instance) (increase(chatim_websocket_reload_failures_total[5m])) + sum by (instance) (increase(chatim_websocket_room_ids_load_failures_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Room loads of a websocket node keep failing; its users get load_failed and no events until a load succeeds (check chat ListMyRoomIDs).
      - alert: ChatimWebsocketDeliverySlow
        expr: histogram_quantile(0.99, sum by (le, instance) (rate(chatim_websocket_event_delivery_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The p99 time from the JetStream store time of an event to its frame queued on a websocket node is above 100ms.
      - alert: ChatimPresenceRedisDown
        expr: chatim_websocket_presence_redis_up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A websocket node cannot reach the presence Redis; its users show offline everywhere and its devices get no presence answers.
      - alert: ChatimWebsocketAuthRateLimited
        expr: sum by (instance) (rate(chatim_websocket_auth_total{result="rate"}[10m])) / sum by (instance) (rate(chatim_websocket_auth_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 10% of the logins on a websocket node get retry_later from the node login limiter; a reconnect storm is waiting, or WS_AUTH_RATE and WS_AUTH_BURST are too low for the node.
      - alert: ChatimWebsocketTokenExpiredSurge
        expr: sum by (instance) (increase(chatim_websocket_auth_required_total{reason="expired"}[10m])) > 1000
        labels:
          severity: warning
        annotations:
          summary: More than 1000 running connections of a websocket node went back to waiting on an expired token in 10m; clients are not renewing tokens in time. The threshold depends on the user count of the node.
      - alert: ChatimGatewayChatUnavailable
        expr: sum(rate(chatim_gateway_commands_total{code="Unavailable"}[5m])) / sum(rate(chatim_gateway_commands_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of gateway commands end Unavailable; chat is down, overloaded or unreachable from the gateway.
  - name: chatim-identity-health
    rules:
      - alert: ChatimIdentityNoSigningKey
        expr: min(chatim_identity_signing_key_ready) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An identity node has no active signing key, so it cannot issue chat tokens and the token exchange answers 503; run key-rotate -activate-if-none, or check IDENTITY_KEY_ENCRYPTION_KEY.
      - alert: ChatimIdentityStoreErrors
        expr: sum(rate(chatim_identity_store_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: identity has been getting MongoDB errors for 5m; just-in-time user writes fail, so token exchanges that need one answer 503.
      - alert: ChatimIdentityExchangeErrors
        expr: sum(increase(chatim_identity_exchanges_total{result="error"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: The identity token exchange answered 503 in the last 5m because a node had no signing key, its directory was not loaded yet, or MongoDB failed a just-in-time user write.
      - alert: ChatimIdentityTrustStale
        expr: max by (instance) (increase(chatim_identity_trust_reload_errors_total[1m])) > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: For 3 minutes an identity replica has failed to reload trusted issuers and keys or holds a trusted key it cannot use; while reloads fail, a tenant key just removed still works for the token exchange on that replica.
  - name: chatim-identity-sync
    rules:
      - alert: ChatimIdentitySyncStale
        expr: |
          max by (instance) (chatim_websocket_identity_revocations_age_seconds) > 30
          or
          max by (instance) (chatim_gateway_identity_revocations_age_seconds) > 30
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A websocket or gateway node has not refreshed the identity revocation list from identity or the shared redis copy for over 30s; tokens revoked since then still work on that node until they expire.
      - alert: ChatimIdentityKeysStale
        expr: |
          max by (instance) (chatim_websocket_identity_keys_age_seconds) > 180
          or
          max by (instance) (chatim_gateway_identity_keys_age_seconds) > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A websocket or gateway node has not fetched the identity JWKS for over 3 minutes; tokens signed by a newly activated key are refused there.
      - alert: ChatimIdentityRefused
        expr: max by (instance) (chatim_websocket_identity_refused) > 0 or max by (instance) (chatim_gateway_identity_refused) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: identity answers a websocket or gateway node with 4xx (wrong node secret or identity url); the node stays not ready. Check *_IDENTITY_SECRET, *_IDENTITY_INTERNAL_URL and *_IDENTITY_JWKS_URL against identity.
      - alert: ChatimJwksConflict
        expr: sum by (instance) (increase(chatim_websocket_jwks_conflicts_total[10m])) > 0 or sum by (instance) (increase(chatim_gateway_jwks_conflicts_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: identity published a key whose kid the node key file holds with a different key; the identity key is ignored there. Check the JWKS file and the identity signing keys.
  - name: chatim-identity-directory
    rules:
      - alert: ChatimIdentityDirectoryNotReady
        expr: min by (instance) (chatim_identity_directory_ready) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An identity replica has not loaded the directory into memory for over 1m, so it stays not ready and serves nothing; MongoDB is down or unreachable, or every load slot is held. Check chatim_identity_directory_load_failures_total and the identity log.
      - alert: ChatimIdentityDirectoryStale
        expr: max by (instance) (chatim_identity_directory_lag_seconds) > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An identity replica has not caught up with the directory change stream for over 30s; GetUsers there returns old names and groups, and sessions revoked since then can still read the directory until the next periodic revocation reload. MongoDB is unreachable from that replica or its change stream keeps failing.
      - alert: ChatimIdentityDirectoryStreamDown
        expr: min by (instance) (chatim_identity_directory_stream_up) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: An identity replica has had no MongoDB change stream for 2m; name changes, user disables, trusted key changes and revocations stop reaching that replica at once; trusted keys and the revocation list still arrive through the periodic reload every IDENTITY_TRUST_RELOAD, names and disables wait for the stream. Check MongoDB and that the Mongo user identity can open a changeStream on chatim_identity.
      - alert: ChatimIdentityMemoryHigh
        expr: |
          (
            go_memstats_heap_inuse_bytes > 0.8 * go_gc_gomemlimit_bytes
            and
            go_gc_gomemlimit_bytes < 9e18
          )
          and on (instance, job) chatim_identity_memory_limit_set
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An identity replica has used over 80% of GOMEMLIMIT for 5m; the directory has grown past what the pod was sized for. Raise the pod memory and GOMEMLIMIT together.
      - alert: ChatimIdentityMemoryLimitUnset
        expr: min by (instance) (chatim_identity_memory_limit_set) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An identity replica runs without GOMEMLIMIT, so the directory in memory can push it into an OOM kill without the GC trying to hold back first. Set GOMEMLIMIT to about 90% of the pod memory limit.
