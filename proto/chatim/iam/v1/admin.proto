syntax = "proto3";

package chatim.iam.v1;

import "chatim/iam/v1/directory.proto";
import "google/protobuf/timestamp.proto";

service AdminService {
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc AssignAccountRole(AssignAccountRoleRequest) returns (AssignAccountRoleResponse);
  rpc UnassignAccountRole(UnassignAccountRoleRequest) returns (UnassignAccountRoleResponse);
  rpc AssignGroupRole(AssignGroupRoleRequest) returns (AssignGroupRoleResponse);
  rpc UnassignGroupRole(UnassignGroupRoleRequest) returns (UnassignGroupRoleResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc SetAccountGroups(SetAccountGroupsRequest) returns (SetAccountGroupsResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
}

message Role {
  string id = 1;
  string name = 2;
  bool builtin = 3;
  int64 ver = 4;
  repeated string permissions = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string updated_by = 8;
}

message AdminGroup {
  string id = 1;
  string name = 2;
  string parent_id = 3;
  bool mentionable = 4;
  repeated string role_ids = 5;
}

message AdminAccount {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  UserState state = 5;
  repeated string group_ids = 6;
  repeated string role_ids = 7;
  google.protobuf.Timestamp created_at = 8;
}

message PermissionList {
  repeated string values = 1;
}

message CreateRoleRequest {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
}

message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  string id = 1;
  optional string name = 2;
  PermissionList permissions = 3;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string role_id = 1;
}

message DeleteRoleResponse {
  int64 accounts_unassigned = 1;
  int64 groups_unassigned = 2;
}

message GetRoleRequest {
  string role_id = 1;
}

message GetRoleResponse {
  Role role = 1;
}

message ListRolesRequest {
  string page_token = 1;
}

message ListRolesResponse {
  repeated Role roles = 1;
  string next_page_token = 2;
}

message AssignAccountRoleRequest {
  string account_id = 1;
  string role_id = 2;
}

message AssignAccountRoleResponse {}

message UnassignAccountRoleRequest {
  string account_id = 1;
  string role_id = 2;
}

message UnassignAccountRoleResponse {}

message AssignGroupRoleRequest {
  string group_id = 1;
  string role_id = 2;
}

message AssignGroupRoleResponse {}

message UnassignGroupRoleRequest {
  string group_id = 1;
  string role_id = 2;
}

message UnassignGroupRoleResponse {}

message CreateGroupRequest {
  string id = 1;
  string name = 2;
  string parent_id = 3;
  optional bool mentionable = 4;
}

message CreateGroupResponse {
  AdminGroup group = 1;
}

message UpdateGroupRequest {
  string id = 1;
  optional string name = 2;
  optional string parent_id = 3;
  optional bool mentionable = 4;
}

message UpdateGroupResponse {
  AdminGroup group = 1;
}

message DeleteGroupRequest {
  string group_id = 1;
}

message DeleteGroupResponse {}

message ListGroupsRequest {
  string page_token = 1;
}

message ListGroupsResponse {
  repeated AdminGroup groups = 1;
  string next_page_token = 2;
}

message SetAccountGroupsRequest {
  string account_id = 1;
  repeated string group_ids = 2;
}

message SetAccountGroupsResponse {}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  AdminAccount account = 1;
}

message ListAccountsRequest {
  string page_token = 1;
}

message ListAccountsResponse {
  repeated AdminAccount accounts = 1;
  string next_page_token = 2;
}
