syntax = "proto3";

package chatim.identity.v1;

service DirectoryService {
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc GetMyProfile(GetMyProfileRequest) returns (GetMyProfileResponse);
}

enum UserState {
  USER_STATE_UNSPECIFIED = 0;
  USER_STATE_ACTIVE = 1;
  USER_STATE_DISABLED = 2;
}

message GetUsersRequest {
  repeated string user_ids = 1;
}

message DirectoryUser {
  string id = 1;
  string display_name = 2;
  string avatar_url = 3;
  UserState state = 4;
}

message GetUsersResponse {
  repeated DirectoryUser users = 1;
}

message GetMyProfileRequest {}

message MyProfile {
  reserved 2, 3;
  reserved "username", "email";
  string id = 1;
  string display_name = 4;
  string avatar_url = 5;
}

message GetMyProfileResponse {
  MyProfile profile = 1;
}
