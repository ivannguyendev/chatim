syntax = "proto3";

package chatim.v1;

import "google/protobuf/timestamp.proto";

service CoreService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc HideMessage(HideMessageRequest) returns (HideMessageResponse);
  rpc ClearHistory(ClearHistoryRequest) returns (ClearHistoryResponse);
  rpc GetEditHistory(GetEditHistoryRequest) returns (GetEditHistoryResponse);
  rpc ReactMessage(ReactMessageRequest) returns (ReactMessageResponse);
  rpc PinMessage(PinMessageRequest) returns (PinMessageResponse);
  rpc UnpinMessage(UnpinMessageRequest) returns (UnpinMessageResponse);
}

enum RoomType {
  ROOM_TYPE_UNSPECIFIED = 0;
  ROOM_TYPE_DM = 1;
  ROOM_TYPE_GROUP = 2;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_TEXT = 1;
}

enum HistoryAnchor {
  HISTORY_ANCHOR_UNSPECIFIED = 0;
  HISTORY_ANCHOR_LATEST = 1;
  HISTORY_ANCHOR_OLDEST = 2;
  HISTORY_ANCHOR_BEFORE = 3;
  HISTORY_ANCHOR_AFTER = 4;
}

enum EditKind {
  EDIT_KIND_UNSPECIFIED = 0;
  EDIT_KIND_ORIGINAL = 1;
  EDIT_KIND_TEXT = 2;
  EDIT_KIND_DELETE = 3;
}

message Room {
  string id = 1;
  string tenant = 2;
  RoomType type = 3;
  string name = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 member_count = 7;
}

message Message {
  reserved 4;
  reserved "pts";
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
  string sender = 5;
  MessageKind kind = 6;
  string text = 7;
  string cid = 8;
  google.protobuf.Timestamp created_at = 9;
  uint32 version = 10;
  bool deleted = 11;
  google.protobuf.Timestamp edited_at = 12;
  bool hidden = 13;
  ReactionSummary reactions = 14;
}

message ReactionCount {
  string emoji = 1;
  uint32 count = 2;
}

message ReactionSummary {
  repeated ReactionCount counts = 1;
  uint64 version = 2;
}

message Pin {
  uint64 thread_root = 1;
  uint64 seq = 2;
  string by = 3;
  google.protobuf.Timestamp pinned_at = 4;
  uint64 pin_version = 5;
}

message MessageVersion {
  uint32 version = 1;
  EditKind kind = 2;
  string text = 3;
  string by = 4;
  google.protobuf.Timestamp at = 5;
}

message CreateRoomRequest {
  RoomType type = 1;
  string name = 2;
  repeated string members = 3;
}

message CreateRoomResponse {
  Room room = 1;
}

message SendMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  string cid = 3;
  string text = 4;
}

message SendMessageResponse {
  reserved 2;
  reserved "pts";
  uint64 seq = 1;
  google.protobuf.Timestamp created_at = 3;
}

message GetHistoryRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  HistoryAnchor anchor = 3;
  uint64 seq = 4;
  int32 limit = 5;
}

message GetHistoryResponse {
  repeated Message messages = 1;
}

message EditMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
  uint32 base_version = 4;
  string text = 5;
}

message EditMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
  uint32 base_version = 4;
}

message DeleteMessageResponse {
  Message message = 1;
}

message HideMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
}

message HideMessageResponse {}

message ClearHistoryRequest {
  string room_id = 1;
  uint64 up_to_seq = 2;
}

message ClearHistoryResponse {
  uint64 cleared_before_seq = 1;
}

message GetEditHistoryRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
  uint32 after_version = 4;
  uint32 limit = 5;
}

message GetEditHistoryResponse {
  repeated MessageVersion versions = 1;
}

message ReactMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
  string emoji = 4;
}

message ReactMessageResponse {
  uint32 change = 1;
  ReactionSummary reactions = 2;
}

message PinMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
}

message PinMessageResponse {
  uint64 pin_version = 1;
  repeated Pin pins = 2;
}

message UnpinMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
}

message UnpinMessageResponse {
  uint64 pin_version = 1;
  repeated Pin pins = 2;
}
