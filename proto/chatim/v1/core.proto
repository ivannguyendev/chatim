syntax = "proto3";

package chatim.v1;

import "chatim/v1/message_links.proto";
import "chatim/v1/reactions_pins.proto";
import "google/protobuf/timestamp.proto";

enum RoomType {
  ROOM_TYPE_UNSPECIFIED = 0;
  ROOM_TYPE_DM = 1;
  ROOM_TYPE_GROUP = 2;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_TEXT = 1;
}

enum HistoryAnchor {
  HISTORY_ANCHOR_UNSPECIFIED = 0;
  HISTORY_ANCHOR_LATEST = 1;
  HISTORY_ANCHOR_OLDEST = 2;
  HISTORY_ANCHOR_BEFORE = 3;
  HISTORY_ANCHOR_AFTER = 4;
}

enum EditKind {
  EDIT_KIND_UNSPECIFIED = 0;
  EDIT_KIND_ORIGINAL = 1;
  EDIT_KIND_TEXT = 2;
  EDIT_KIND_DELETE = 3;
}

message Room {
  string id = 1;
  string tenant = 2;
  RoomType type = 3;
  string name = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 member_count = 7;
}

message Message {
  reserved 4;
  reserved "pts";
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
  string sender = 5;
  MessageKind kind = 6;
  string text = 7;
  string cid = 8;
  google.protobuf.Timestamp created_at = 9;
  uint32 ver = 10;
  bool deleted = 11;
  google.protobuf.Timestamp edited_at = 12;
  bool hidden = 13;
  ReactionSummary reactions = 14;
  ReplyRef reply_to = 15;
  ForwardRef forward_from = 16;
  repeated MentionTarget mention_targets = 17;
  bool mention_all = 18;
  ReplyCount reply_count = 19;
  ReplyPreview reply_preview = 20;
}

message MessageVersion {
  uint32 ver = 1;
  EditKind kind = 2;
  string text = 3;
  string by = 4;
  google.protobuf.Timestamp at = 5;
  MentionSet mentions = 6;
}

message CreateRoomRequest {
  RoomType type = 1;
  string name = 2;
  repeated string members = 3;
  string request_id = 4;
}

message CreateRoomResponse {
  Room room = 1;
}

message OpenDirectRoomRequest {
  string other_user = 1;
}

message OpenDirectRoomResponse {
  Room room = 1;
  bool created = 2;
}

message SendMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  string cid = 3;
  string text = 4;
  ReplyRef reply_to = 5;
  ForwardRef forward_from = 6;
  MentionSet mentions = 7;
}

message SendMessageResponse {
  reserved 2;
  reserved "pts";
  uint64 seq = 1;
  google.protobuf.Timestamp created_at = 3;
}

message GetHistoryRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  HistoryAnchor anchor = 3;
  uint64 seq = 4;
  int32 limit = 5;
}

message GetHistoryResponse {
  repeated Message messages = 1;
}

message EditMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
  uint32 base_ver = 4;
  string text = 5;
  MentionSet mentions = 6;
}

message EditMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
  uint32 base_ver = 4;
}

message DeleteMessageResponse {
  Message message = 1;
}

message HideMessageRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
}

message HideMessageResponse {}

message ClearHistoryRequest {
  reserved 2;
  reserved "up_to_seq";
  string room_id = 1;
}

message ClearHistoryResponse {
  reserved 1;
  reserved "cleared_before_seq";
  google.protobuf.Timestamp cleared_at = 2;
}

message GetEditHistoryRequest {
  string room_id = 1;
  uint64 thread_root = 2;
  uint64 seq = 3;
  uint32 after_ver = 4;
  uint32 limit = 5;
}

message GetEditHistoryResponse {
  repeated MessageVersion versions = 1;
}
