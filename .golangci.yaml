version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - noctx
    - fatcontext
    - errorlint
    - errname
    - nilerr
    - gosec
    - sloglint
    - spancheck
    - exhaustive
    - gocritic
    - revive
    - misspell
    - unconvert
    - usestdlibvars
    - perfsprint
    - intrange
    - modernize
    - depguard
  settings:
    depguard:
      rules:
        domain-boundaries:
          files:
            - "**/apps/core/internal/message/**"
            - "**/apps/core/internal/interaction/**"
            - "**/apps/core/internal/member/**"
            - "**/apps/core/internal/room/**"
            - "**/apps/core/internal/dedupe/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/api
              desc: domains never import transport
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/app
              desc: domains never import wiring
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/config
              desc: domains never import config
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/send/actor
              desc: domains never import the send actor
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/event/publish
              desc: domains never import event delivery
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/event/sweep
              desc: domains never import event delivery
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/event/projection
              desc: domains never import event delivery
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/event/resync
              desc: domains never import event delivery
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/event/stateclear
              desc: domains never import event delivery
        member-domain:
          files:
            - "**/apps/core/internal/member/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/room
              desc: member never imports other domains
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/interaction
              desc: member never imports other domains
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/message
              desc: member never imports other domains
        message-domain:
          files:
            - "**/apps/core/internal/message/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/interaction
              desc: message never imports other domains
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/room
              desc: message never imports other domains
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/member
              desc: message never imports other domains
        interaction-domain:
          files:
            - "**/apps/core/internal/interaction/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/room
              desc: interaction never imports room or member
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/member
              desc: interaction never imports room or member
        event-layer:
          files:
            - "**/apps/core/internal/event/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/message
              desc: events never import domains
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/interaction
              desc: events never import domains
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/member
              desc: events never import domains
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/room
              desc: events never import domains
        config-owner:
          files:
            - "**/apps/core/**"
            - "!**/apps/core/internal/app/**"
            - "!**/apps/core/internal/config/**"
            - "!**/apps/core/itest/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/core/internal/config
              desc: only app reads config
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    sloglint:
      context: scope
      no-mixed-args: true
    spancheck:
      checks: [end, record-error]
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: receiver-naming
        - name: unused-parameter
        - name: var-naming
  exclusions:
    generated: lax
    presets: [common-false-positives, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx, revive]
      - path: ^tools/poc/
        linters: [gosec]
        text: "G115|G404"
      - path: ^pkg/backoff/backoff\.go$
        linters: [gosec]
        text: G404
      - path: ^apps/core/internal/config/parse\.go$
        linters: [gosec]
        text: G703

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/ivannguyendev/chatim]
