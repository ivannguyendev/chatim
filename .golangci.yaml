version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - noctx
    - fatcontext
    - errorlint
    - errname
    - nilerr
    - gosec
    - sloglint
    - spancheck
    - exhaustive
    - gocritic
    - revive
    - misspell
    - unconvert
    - usestdlibvars
    - perfsprint
    - intrange
    - modernize
    - depguard
  settings:
    depguard:
      rules:
        pkg-shared-only:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps
              desc: pkg holds shared code only
            - pkg: github.com/ivannguyendev/chatim/modules
              desc: pkg holds shared code only
        pkg-core-zero-domain:
          files:
            - "**/pkg/core/**"
          list-mode: lax
          allow:
            - github.com/ivannguyendev/chatim/pkg/core
          deny:
            - pkg: github.com/ivannguyendev/chatim/pkg
              desc: pkg/core is zero-domain
            - pkg: github.com/ivannguyendev/chatim/apps
              desc: pkg/core is zero-domain
            - pkg: github.com/ivannguyendev/chatim/modules
              desc: pkg/core is zero-domain
        wstest-tests-only:
          files:
            - "**/apps/**"
            - "**/modules/**"
            - "**/pkg/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/ivannguyendev/chatim/pkg/wstest
              desc: pkg/wstest is a test client for tests and tools only (D208)
            - pkg: github.com/ivannguyendev/chatim/pkg/auth/authtest
              desc: pkg/auth/authtest holds identity fakes for tests only
        domain-boundaries:
          files:
            - "**/apps/chat/internal/message/**"
            - "**/apps/chat/internal/interaction/**"
            - "**/apps/chat/internal/member/**"
            - "**/apps/chat/internal/room/**"
            - "**/apps/chat/internal/dedupe/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/api
              desc: domains never import transport
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/app
              desc: domains never import wiring
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/config
              desc: domains never import config
        domain-event-delivery:
          files:
            - "**/apps/chat/internal/message/**"
            - "**/apps/chat/internal/interaction/**"
            - "**/apps/chat/internal/member/**"
            - "**/apps/chat/internal/room/**"
            - "**/apps/chat/internal/dedupe/**"
            - "!**/apps/chat/internal/message/actor/*_test.go"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/event/publish
              desc: domains never import event delivery
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/event/sweep
              desc: domains never import event delivery
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/event/projection
              desc: domains never import event delivery
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/event/resync
              desc: domains never import event delivery
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/event/stateclear
              desc: domains never import event delivery
        send-actor:
          files:
            - "**/apps/chat/internal/message/**"
            - "**/apps/chat/internal/interaction/**"
            - "**/apps/chat/internal/member/**"
            - "**/apps/chat/internal/room/**"
            - "**/apps/chat/internal/dedupe/**"
            - "!**/apps/chat/internal/message/actor/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/message/actor
              desc: domains never import the send actor
        member-domain:
          files:
            - "**/apps/chat/internal/member/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/room
              desc: member never imports other domains
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/interaction
              desc: member never imports other domains
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/message
              desc: member never imports other domains
        message-domain:
          files:
            - "**/apps/chat/internal/message/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/interaction
              desc: message never imports other domains
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/room
              desc: message never imports other domains
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/member
              desc: message never imports other domains
        interaction-domain:
          files:
            - "**/apps/chat/internal/interaction/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/room
              desc: interaction never imports room or member
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/member
              desc: interaction never imports room or member
        room-domain:
          files:
            - "**/apps/chat/internal/room/**"
            - "!**/apps/chat/internal/room/roomlist/**"
            - "!**/apps/chat/internal/room/roomcache/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/message
              desc: room imports only the member domain
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/interaction
              desc: room imports only the member domain
        room-read-models:
          files:
            - "**/apps/chat/internal/room/roomlist/**"
            - "**/apps/chat/internal/room/roomcache/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/message
              desc: the room list and its caches read only model and store
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/interaction
              desc: the room list and its caches read only model and store
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/member
              desc: the room list and its caches read only model and store
        event-layer:
          files:
            - "**/apps/chat/internal/event/**"
            - "!$test"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/message
              desc: events never import domains
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/interaction
              desc: events never import domains
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/member
              desc: events never import domains
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/room
              desc: events never import domains
        event-layer-tests:
          files:
            - "**/apps/chat/internal/event/**/*_test.go"
          list-mode: lax
          allow:
            - github.com/ivannguyendev/chatim/apps/chat/internal/interaction/pinproj
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/message
              desc: event tests import only the pin projector of a domain
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/interaction
              desc: event tests import only the pin projector of a domain
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/member
              desc: event tests import only the pin projector of a domain
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/room
              desc: event tests import only the pin projector of a domain
        api-store-adapters:
          files:
            - "**/apps/chat/internal/api/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/store/mongostore
              desc: transport reads through domains, never a store adapter
        api-memstore:
          files:
            - "**/apps/chat/internal/api/**"
            - "!$test"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/store/memstore
              desc: only api tests use the in-memory store
        config-owner:
          files:
            - "**/apps/chat/**"
            - "!**/apps/chat/internal/app/**"
            - "!**/apps/chat/internal/config/**"
            - "!**/apps/chat/itest/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat/internal/config
              desc: only app reads config
        mention-module-entry:
          files:
            - "**/apps/chat/**"
            - "!**/apps/chat/internal/app/**"
            - "!**/apps/chat/internal/config/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/modules/mention
              desc: only app and config embed the mention module
        websocket-boundaries:
          files:
            - "**/apps/websocket/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat
              desc: websocket reaches chat only through gRPC and shared pkg code
            - pkg: github.com/ivannguyendev/chatim/apps/identity
              desc: websocket reaches identity only over the network
            - pkg: github.com/ivannguyendev/chatim/modules
              desc: websocket embeds no business module
        websocket-config-owner:
          files:
            - "**/apps/websocket/**"
            - "!**/apps/websocket/internal/app/**"
            - "!**/apps/websocket/internal/config/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/websocket/internal/config
              desc: only app reads config
        gateway-boundaries:
          files:
            - "**/apps/gateway/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat
              desc: gateway reaches chat only through gRPC and shared pkg code
            - pkg: github.com/ivannguyendev/chatim/apps/websocket
              desc: gateway shares code with websocket only through pkg
            - pkg: github.com/ivannguyendev/chatim/apps/identity
              desc: gateway reaches identity only over the network
            - pkg: github.com/ivannguyendev/chatim/modules
              desc: gateway embeds no business module
        gateway-config-owner:
          files:
            - "**/apps/gateway/**"
            - "!**/apps/gateway/internal/app/**"
            - "!**/apps/gateway/internal/config/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/gateway/internal/config
              desc: only app reads config
        identity-boundaries:
          files:
            - "**/apps/identity/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/chat
              desc: identity owns its own data and never reaches chat tables or code
            - pkg: github.com/ivannguyendev/chatim/apps/websocket
              desc: identity shares code with websocket only through pkg
            - pkg: github.com/ivannguyendev/chatim/apps/gateway
              desc: identity shares code with gateway only through pkg
            - pkg: github.com/ivannguyendev/chatim/modules
              desc: identity embeds no chat module
            - pkg: github.com/nats-io
              desc: identity does not depend on NATS (owner 2026-10-27)
        auth-no-nats:
          files:
            - "**/pkg/auth/**"
          deny:
            - pkg: github.com/nats-io
              desc: revocations and keys reach nodes over https from identity, never through NATS (owner 2026-10-27)
        identity-config-owner:
          files:
            - "**/apps/identity/**"
            - "!**/apps/identity/internal/app/**"
            - "!**/apps/identity/internal/config/**"
          deny:
            - pkg: github.com/ivannguyendev/chatim/apps/identity/internal/config
              desc: only app reads config
        identity-trust-pure:
          files:
            - "**/apps/identity/internal/trust/**"
          deny:
            - pkg: go.mongodb.org/mongo-driver
              desc: trust reads issuers and keys only through store.TrustSource
            - pkg: connectrpc.com/connect
              desc: trust knows no transport
            - pkg: github.com/ivannguyendev/chatim/apps/identity/internal/api
              desc: trust knows no transport
            - pkg: github.com/ivannguyendev/chatim/apps/identity/internal/app
              desc: app wires trust, never the other way
            - pkg: github.com/ivannguyendev/chatim/apps/identity/internal/admincmd
              desc: admincmd uses trust, never the other way
            - pkg: github.com/ivannguyendev/chatim/apps/identity/internal/exchange
              desc: exchange uses trust, never the other way
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    sloglint:
      context: scope
      no-mixed-args: true
    spancheck:
      checks: [end, record-error]
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: receiver-naming
        - name: unused-parameter
        - name: var-naming
  exclusions:
    generated: lax
    presets: [common-false-positives, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx, revive]
      - path: ^tools/poc/
        linters: [gosec]
        text: "G115|G404"
      - path: ^pkg/core/backoff/backoff\.go$
        linters: [gosec]
        text: G404
      - path: ^pkg/auth/authtest/
        linters: [gosec]
        text: G101
      - path: ^pkg/core/envconfig/secret\.go$
        linters: [gosec]
        text: G703

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/ivannguyendev/chatim]
